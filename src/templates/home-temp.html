<!DOCTYPE html>
<html lang="en" id="html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope&family=Akaya Kanadaka&display=swap">
    <link rel="stylesheet" href="../statics/css/home.css">
    

    <title> Re-Design v2 </title>
</head>

<body id="body">
  {% extends "base-temp.html" %}
  
  {% block scripts %}
    <script defer src="../statics/js/home.js"></script>
  {% endblock %}   
  
  {% block content %}
    <!-- Home Section -->
    <div class="home-housing">
      <h1 class="home-title"> 
        The Assured Booking Site <br> 
        <span class="sub_text"> for Bristol Community Events </span>
      </h1>
      <button href="" class="home-prompt-btn"> Explore Events </button>
    </div>
    <div class="events"></div>

    <!-- Event Section -->
    <div class="event-housing">
      <h1 class="nav-section-title"> Featured Events </h1> 

      <div class="event-carousel">
        <template id="card-template">
          <div class="ft-card card-closed">
            <div class="closed-cont">
                  <h1 class="evnt-alias"> BBF</h1>
                <div class="sep-bar"></div>
                <h1 class="evnt-date">1 / 1 / 2025</h1>
            </div>

            <div class="opened-cont">
              <h1 class="evnt-category">Entertainments</h1>
              <h1 class="evnt-title">Bristol Ballon Fiesta</h1>
              <h1 class="evnt-desc">Twice-daily launches (weather permitting) at dawn (~6:00 am) and dusk (~6:00 pm), where over 100 balloons of all shapes and colours fill the sky simultaneously.</h1>
              
              <div class="evnt-details">
                <div class="evnt-detail-card date-detail">
                  <div class="evnt-icon date-icon"></div>
                  <h1 class="date-txt detail-txt">Date</h1>
                  <h1 class="date detail-info">September 10, 2026</h1>
                </div>

                <div class="evnt-detail-card cap-detail">
                  <div class="evnt-icon cap-icon"></div>
                  <h1 class="date-txt detail-txt">Capacity</h1>
                  <h1 class="capacity detail-info">5000</h1>
                </div>

                <div class="evnt-detail-card price-detail">
                  <div class="evnt-icon ticket-icon"></div>
                  <h1 class="date-txt detail-txt">Price</h1>
                  <h1 class="price detail-info">£150</h1>
                </div>

              </div>

              <div class="price-loc-cont">
                <div class="evnt-loc-icon evnt-icon loc-icon"></div>
                <div class="evnt-loc">Ashton Gate, Bristol</div>
                <div class="btn-ctn"><button class="start-booking-desktop booking-btn"> Start Boooking </button></div>
              </div>

              <div class="movement-dot-cont">
                <div class="dot-cont-mobile"></div>

                <div class="movement-btns">
                  <div class="prev"><button class="mv-btn-icon prev-icon"></button></div>
                  <div class="next"><button class="mv-btn-icon next-icon"></button></div>
                </div>
              </div>

              <div class="dot-cont-desktop"></div>

              <button class="start-booking-mobile booking-btn"> Start Boooking </button>
            </div>
          </div>
        </template>
      </div>
      <template id="dot-template">
        <div class="dot dot-closed"></div>
      </template>
    </div>

    <div class="main3 s-b">
      <h1 class="question-title"> FAQ </h1>
      <div class="question-housing">

        <template id="question-template">
          <div class="question-separator"></div>
          <div class="q-and-a-card">

            <div class="question-card closed">
              <div class="question-txt">What is your privacy policy?</div>
              <button class="question-icon-btn">
                <div class="question-icon"></div>
              </button>   
            </div>
            
            <div class="answer-wrapper closed">
              <div class="answer-card">
                We take your privacy seriously. We only collect necessary information to process your orders and improve your experience. We never sell your personal data to third parties. View our full privacy policy in the footer of our website.
              </div>    
            </div>
          </div>
        </template>

        <template id="help-template">
          <div class="question-help">
            Have More Questions? Visit our 
            <a href="/Help" class="question-help-page"> Help Page. </a>
          </div>
        </template>
      </div>
    </div>

    <div class="CTA-housing">
      <h1 class="CTA-title"> Ready to Book your Next Experience? </h1>
      <div class="CTA-Prompt">
        <a href="../Event" class = "CTA-Prompt-btn" > Try for Free </a>
        <h1 class="CTA-Prompt-text">Get Started in less than 30 seconds </h1>
      </div>
    </div>
  {% endblock %}
</body>
</html>
